name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Default for every job: read-only. Only the release job below asks for more.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lint

      - name: Build debug APK
        run: ./gradlew assembleDebug -PappVersionCode=${{ github.run_number }}

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

  # Runs only if the build job (lint, build, tests) succeeded, and only for pushes
  # to main, never for pull requests. This is the only job with write access.
  # Obtainium watches these releases and installs the APK.
  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v8
        with:
          name: app-debug

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv app-debug.apk githunt-debug.apk
          gh release create "build-${{ github.run_number }}" githunt-debug.apk \
            --repo "${{ github.repository }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}" \
            --target "${{ github.sha }}" \
            --latest

      # Posts to the Discord channel behind the DISCORD_WEBHOOK_URL repo secret.
      # If the secret isn't set, or Discord is down, this is skipped without
      # failing the release.
      - name: Notify Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BUILD: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not set, skipping Discord notification."
            exit 0
          fi
          URL="https://github.com/$REPO/releases/tag/build-$BUILD"
          MSG="GitHunt Build $BUILD is out (commit ${SHA:0:7}). Update it from Obtainium. $URL"
          jq -n --arg content "$MSG" '{content: $content}' \
            | curl -sSf -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
